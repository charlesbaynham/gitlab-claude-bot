[project]
name = "gitlab-claude-bot"
version = "0.1.0"
description = "A polling bot that runs Claude Code against GitLab to-dos and merge request comments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
gitlab-claude-bot = "gitlab_claude_bot.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_claude_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
