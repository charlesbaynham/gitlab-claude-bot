name: Build Proxmox LXC template

# Path-filtered: only what reaches the rootfs rebuilds (and so redeploys) the container.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-template.yml"
  workflow_dispatch:

jobs:
  lxc-template:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      # This repo's default branch is `main`; the reusable workflow assumes `master`.
      release_branch: main
